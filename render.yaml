services:
  - type: web
    name: digestdesk
    runtime: node
    plan: free
    buildCommand: pnpm install && pnpm run build:all
    startCommand: node server/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: OPENAI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gpt-4o-mini
